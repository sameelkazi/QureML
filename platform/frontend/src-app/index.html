<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QureML — Hybrid Quantum-Classical Clinical Triage Platform</title>

  <!-- Typography & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#006194",
            "primary-container": "#007bb9",
            "on-primary": "#ffffff",
            secondary: "#ba0035",
            "secondary-container": "#e21e49",
            "on-secondary": "#ffffff",
            background: "#f8f9ff",
            surface: "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e5eeff",
            "surface-container-high": "#dce9ff",
            "on-surface": "#0b1c30",
            "on-surface-variant": "#3f4850",
            outline: "#707881",
            "outline-variant": "#bfc7d2",
            tertiary: "#545c72",
            success: "#0f7a3d",
            "success-container": "#e3f7ec"
          },
          fontFamily: {
            sans: ["Inter", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .spinner {
      border: 2px solid rgba(0, 97, 148, 0.2);
      border-top-color: #006194;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    html { scroll-behavior: smooth; }
    @media print {
      header, footer, button, .no-print { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; font-size: 10pt !important; }
      main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
    }
  </style>

  <!-- Modern Import Map for React 18 ESM -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">
  <div id="root">
    <div class="flex items-center justify-center min-h-screen">
      <div class="flex items-center gap-3 p-4 rounded-xl bg-surface-container-lowest border border-outline-variant shadow-sm text-sm font-medium text-primary">
        <span class="spinner"></span> Loading QureML Clinical Platform...
      </div>
    </div>
  </div>

  <script type="module" src="./bundle.js"></script>
</body>
</html>
